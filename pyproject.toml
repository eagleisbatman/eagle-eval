[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle-eval"
version = "0.2.0"
description = "Local-first, goal-first evaluation runner for agentic AI applications."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
  {name = "Eagle Eval Authors"}
]
keywords = [
  "ai", "agents", "evaluation", "evals", "llm", "testing", "regression",
  "goal-oriented", "multilingual", "claude-code", "codex"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "click>=8.0",
  "langdetect>=1.0.9",
  "pyyaml>=6.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=8.0"]
gemini = ["google-genai>=1.0"]
langfuse = ["langfuse>=4.0"]
langsmith = ["langsmith>=0.3.0"]
openai = ["openai>=1.0"]
vertex = ["google-genai>=1.0"]
all = [
  "anthropic>=0.39",
  "google-genai>=1.0",
  "langfuse>=4.0",
  "langsmith>=0.3.0",
  "openai>=1.0",
]

[project.scripts]
eagle-eval = "eagle_eval.cli:cli"

[project.urls]
Homepage = "https://github.com/YOUR_ORG/eagle-eval"
Documentation = "https://github.com/YOUR_ORG/eagle-eval#readme"
Repository = "https://github.com/YOUR_ORG/eagle-eval"
Changelog = "https://github.com/YOUR_ORG/eagle-eval/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["eagle_eval*"]
