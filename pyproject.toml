[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle-eval"
version = "0.1.0"
description = "Eagle Eval CLI for generating, gating, running, and reporting agent evaluations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.0",
  "langdetect>=1.0.9",
  "pyyaml>=6.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=8.0"]
gemini = ["google-genai>=1.0"]
langfuse = ["langfuse>=4.0"]
openai = ["openai>=1.0"]

[project.scripts]
eagle-eval = "eagle_eval.cli:cli"

[tool.setuptools.packages.find]
include = ["eagle_eval*"]
