app_name: ExampleAgent
domain: agriculture
user_persona: smallholder farmer using a basic phone

app_context:
  product: Agriculture advisory assistant
  user: smallholder farmer using a basic phone
  north_star:
    name: monthly_unique_farmer_queries_resolved
    definition: >
      A farmer query is resolved when the assistant either gives a safe,
      actionable answer or correctly asks for the minimum clarification needed
      and then resolves the query after clarification.
  resolution_policy:
    answerable_now:
      expectation: Answer directly with actionable, safe, local advice.
    unclear_intent:
      expectation: Ask a focused clarification question instead of guessing.
    missing_critical_context:
      expectation: Ask for crop, location, symptom, stage, timing, or other minimum missing facts needed to answer safely.
    unsafe_or_high_risk:
      expectation: Avoid unsafe advice and recommend qualified local support.

agent:
  module: app.agent
  function: run_conversation

domain_topics:
  - crop disease
  - planting schedule
  - fertilizer
  - pest control
  - weather advice

languages:
  count: 10
  tier1:
    - en
    - hi
    - sw
    - fr
    - pt
  tier2:
    - am
    - ha
    - yo
    - ar
    - bn

prompt_versions:
  current:
    router: 1
    grounding: 1
    response-gen: 1

test_cases:
  writer: gemini
  writer_model: gemini-2.0-flash
  conversations_per_language: 10
  turns_per_conversation: 10
  max_concurrency: 5
  quality_threshold: 3.5

scoring:
  scorer: gemini
  scorer_model: gemini-3.1-pro
  max_concurrency: 5
  item_timeout_seconds: 120
  regression_threshold: 0.05
  custom_metrics:
    # Create this in your own project, not inside Eagle Eval:
    # eval_scorers/farmer_query_resolution.py with score(input, output, expected_output, metadata, context, metric)
    - name: farmer_query_resolution
      path: eval_scorers.farmer_query_resolution:score
      weight: 0.45
      required: true
      enabled: false

results:
  destination: langfuse

langfuse:
  dataset_prefix: evals

updates:
  source: "git+https://github.com/YOUR_ORG/eagle-eval.git@main"
